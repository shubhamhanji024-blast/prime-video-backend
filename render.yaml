services:
  - type: web
    name: prime-video-backend
    runtime: node
    repo: https://github.com/shubhamhanji024-blast/prime-video-backend.git
    branch: master
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
